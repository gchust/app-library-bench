name: Release fork on custom merge

on:
  pull_request:
    types: [closed]
    branches:
      - custom/main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA to release. Defaults to custom/main.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fork-release-${{ github.event.inputs.source_sha || github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Albert-mah/app-library-bench
  CUSTOM_BRANCH: custom/main

jobs:
  release:
    name: Build and publish fork release
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: macos-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_sha || github.event.pull_request.merge_commit_sha || 'custom/main' }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Derive fork version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          existing_tag="$(git tag --points-at "${source_sha}" --list 'v*-fork.*' | sort -V | tail -1 || true)"
          if [ -n "${existing_tag}" ]; then
            echo "Commit ${source_sha} already has fork release tag ${existing_tag}; skipping duplicate release."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${existing_tag}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          upstream_tag="$(gh release view --repo "${UPSTREAM_REPO}" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "${upstream_tag}" ]; then
            base_version="${upstream_tag#v}"
            base_marker="${upstream_tag}"
          else
            base_version="$(node -p "require('./package.json').version")"
            base_marker="package.json v${base_version} (no upstream GitHub release found)"
          fi

          last_number="$(git tag --list "v${base_version}-fork.*" | sed -E 's/^v.*-fork\.([0-9]+)$/\1/' | sort -n | tail -1)"
          if [ -z "${last_number}" ]; then
            next_number=1
          else
            next_number=$((last_number + 1))
          fi

          tag="v${base_version}-fork.${next_number}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "base_marker=${base_marker}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies and build
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npm ci
          npm run validate
          npm run build:ui

      - name: Package release asset
        if: steps.version.outputs.skip != 'true'
        id: package
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          package_dir="release/app-library-bench-${tag}"
          mkdir -p "${package_dir}/app"

          cp package.json package-lock.json README.md METHODOLOGY.md LICENSE "${package_dir}/"
          cp -R server "${package_dir}/server"
          cp -R web "${package_dir}/web"
          cp -R app/dist "${package_dir}/app/dist"

          asset="release/app-library-bench-${tag}-macos-web.zip"
          (cd release && ditto -c -k --sequesterRsrc --keepParent "app-library-bench-${tag}" "app-library-bench-${tag}-macos-web.zip")
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Create tag and GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          source_sha="${{ steps.version.outputs.source_sha }}"
          base_marker="${{ steps.version.outputs.base_marker }}"
          asset="${{ steps.package.outputs.asset }}"
          notes_file="release/${tag}-notes.md"

          {
            echo "Fork release ${tag}"
            echo
            echo "- Upstream base marker: ${base_marker}"
            echo "- Fork source commit: ${source_sha}"
            echo "- Built from branch model: \`main\` mirrors upstream, \`custom/main\` contains fork changes."
            echo "- Build target: macOS runner, web/server release bundle."
          } > "${notes_file}"

          git tag -a "${tag}" -m "Fork release ${tag}" "${source_sha}"
          git push origin "refs/tags/${tag}"
          gh release create "${tag}" "${asset}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${source_sha}" \
            --title "${tag}" \
            --notes-file "${notes_file}"
